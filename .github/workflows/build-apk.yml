name: Build Android APK (Official Flow)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Sign APK (Debug Keystore)
      run: |
        for apk in app/build/outputs/apk/release/*-unsigned.apk; do
          if [ -f "$apk" ]; then
            signed_apk="${apk%-unsigned.apk}.apk"
            echo "Signing $apk -> $signed_apk"
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks ~/.android/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$signed_apk" "$apk"
          fi
        done

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v4
      with:
        name: TalkifyTTS-arm64-v8a
        path: app/build/outputs/apk/release/*arm64-v8a*.apk
